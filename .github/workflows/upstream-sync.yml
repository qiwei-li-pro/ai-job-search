# Owner-requested automatic sync for this unmodified fork.
# Uses GitHub's merge-upstream API: local commits are preserved; conflicts fail.
# Never force-push, reset, discard changes, or grant broader token permissions.
# If GitHub rejects upstream workflow-file changes, resolve that update manually;
# do not add a PAT or weaken repository security to bypass the rejection.
name: Automatic upstream sync

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/upstream-sync.yml
  schedule:
    - cron: "17 8 * * *" # Daily at 08:17 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'qiwei-li-pro/ai-job-search' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream safely into master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Pin the repository's stable numeric identity, not its owner/name:
          # MadsLorentzen/ai-job-search moved to ai-job-search-dev in October 2026.
          # A transfer/rename is safe; a different parent or branch still stops.
          gh api "repos/$GH_REPO" > repo.json
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          repo = json.loads(Path("repo.json").read_text(encoding="utf-8"))
          parent = repo.get("parent") or {}
          checks = {
              "target repository": repo.get("full_name") == os.environ["GH_REPO"],
              "fork relationship": repo.get("fork") is True,
              "upstream repository ID": parent.get("id") == 1185389803,
              "fork default branch": repo.get("default_branch") == "master",
              "upstream default branch": parent.get("default_branch") == "master",
          }
          failed = [name for name, valid in checks.items() if not valid]
          observed = (
              f"parent={parent.get('full_name')!r}, id={parent.get('id')!r}, "
              f"fork branch={repo.get('default_branch')!r}, "
              f"upstream branch={parent.get('default_branch')!r}"
          )
          if failed:
              message = f"Fork validation failed ({', '.join(failed)}): {observed}. No merge attempted."
              print(f"::error::{message}", file=sys.stderr)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Upstream sync stopped\n\n{message}\n")
              sys.exit(1)
          print(f"Validated upstream: {observed}")
          PY

          if ! gh api --method POST "repos/$GH_REPO/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f branch=master > sync-result.json; then
            echo "::error::Upstream sync stopped. Check for conflicts, workflow-file restrictions, or branch permissions. No force/reset fallback was attempted."
            echo "## Upstream sync stopped" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub rejected the merge. Review this run's logs and resolve the cause manually; existing commits were not force-overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat sync-result.json
          {
            echo "## Upstream sync"
            jq -r '.message, ("Merge type: " + (.merge_type // "none")), ("Base branch: " + (.base_branch // "master"))' sync-result.json
            echo
            echo "Source: $(jq -r '.parent.full_name' repo.json) (master; repository ID 1185389803)"
            echo "Target: $GH_REPO (master)"
            echo "Local commits are preserved. Conflicts stop the run."
          } >> "$GITHUB_STEP_SUMMARY"
