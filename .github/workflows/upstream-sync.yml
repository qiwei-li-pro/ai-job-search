# Owner-requested automatic sync for this unmodified fork.
# Uses GitHub's merge-upstream API: local commits are preserved; conflicts fail.
# Never force-push, reset, discard changes, or grant broader token permissions.
# If GitHub rejects upstream workflow-file changes, resolve that update manually;
# do not add a PAT or weaken repository security to bypass the rejection.
name: Automatic upstream sync

on:
  schedule:
    - cron: "17 8 * * *" # Daily at 08:17 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'qiwei-li-pro/ai-job-search' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge upstream safely into master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to sync if the fork relationship or default branch changes.
          gh api "repos/$GH_REPO" > repo.json
          jq -e '.fork == true and .parent.full_name == "MadsLorentzen/ai-job-search" and .default_branch == "master" and .parent.default_branch == "master"' repo.json > /dev/null

          if ! gh api --method POST "repos/$GH_REPO/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f branch=master > sync-result.json; then
            echo "::error::Upstream sync stopped. Check for conflicts, workflow-file restrictions, or branch permissions. No force/reset fallback was attempted."
            echo "## Upstream sync stopped" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub rejected the merge. Review this run's logs and resolve the cause manually; existing commits were not force-overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat sync-result.json
          {
            echo "## Upstream sync"
            jq -r '.message, ("Merge type: " + (.merge_type // "none")), ("Base branch: " + (.base_branch // "master"))' sync-result.json
            echo
            echo "Source: MadsLorentzen/ai-job-search (master)"
            echo "Target: $GH_REPO (master)"
            echo "Local commits are preserved. Conflicts stop the run."
          } >> "$GITHUB_STEP_SUMMARY"
